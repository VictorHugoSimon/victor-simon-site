name: Visual QA STAGING

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feature/growth-os-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar STAGING publicado
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://victor-simon-site-staging.pages.dev'

          curl -fsSL --retry 5 --retry-delay 2 "$BASE/" -o /tmp/home.html
          grep -Fq 'Clareza para decidir. Método para executar. Resultado para crescer.' /tmp/home.html
          grep -Fq 'id="consultoria"' /tmp/home.html
          grep -Fq 'id="servicos"' /tmp/home.html
          grep -Fq 'id="metodo"' /tmp/home.html
          grep -Fq 'id="projetos"' /tmp/home.html
          grep -Fq 'id="ifarm"' /tmp/home.html
          grep -Fq '/assets/profile-v2.css' /tmp/home.html
          ! grep -Fq 'class="initials">VS</span>' /tmp/home.html

          curl -fsSL --retry 5 --retry-delay 2 "$BASE/blog" -o /tmp/blog.html
          grep -Fq 'articleView' /tmp/blog.html
          grep -Fq 'Gestão que funciona no mundo real.' /tmp/blog.html

          curl -fsSL --retry 5 --retry-delay 2 "$BASE/painel.html" -o /tmp/painel.html
          grep -Fq 'Growth OS' /tmp/painel.html

          echo 'STAGING funcional confirmado.'

      - name: Instalar Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capturar evidências visuais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/screenshots
          BASE='https://victor-simon-site-staging.pages.dev'
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1000' "$BASE/" qa/screenshots/home-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='390,844' "$BASE/" qa/screenshots/home-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1000' "$BASE/blog" qa/screenshots/blog-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1000' "$BASE/painel.html" qa/screenshots/painel-login.png

      - name: Publicar evidências
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-staging
          path: qa/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
