name: Growth Docs Sync

on:
  push:
    branches:
      - feature/growth-loop-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/growth-loop-v1
          fetch-depth: 0
      - name: Atualizar status arquitetural
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/GROWTH-OS-ARCHITECTURE.md')
          text = p.read_text()
          replacements = {
            '1. Radar — tendências, temas e oportunidades. Planejado.': '1. Radar — **implementado no Growth Loop V1**; cria pautas a partir de sinais fornecidos ou lacunas editoriais.',
            '2. Estrategista — priorização por pilar, autoridade e negócio. Planejado.': '2. Estrategista — **implementado no Growth Loop V1**; reavalia pautas por histórico do pilar, evidência e recência.',
            '3. Pesquisador — fontes, fatos, dados e contexto. Planejado.': '3. Pesquisador — **implementado no Growth Loop V1**; lê fonte HTTPS, resume fatos e grava evidência para revisão.',
            '9. Analytics / Growth Coach — planejados para o ciclo de métricas e otimização.': '9. Analytics / Growth Coach — **implementados no Growth Loop V1** com Content Score, performance de 30 dias e recomendações.',
            '- Futuro: Cron Triggers para Radar, Analytics, refresh e sincronizações': '- Cron Trigger diário implementado para fila de publicação + Radar + Estratégia + Analytics + Growth Coach',
            '### Growth Loop\n- status/retry assíncrono de publicação\n- métricas por canal\n- atribuição UTM\n- leads por conteúdo/campanha\n- Content Score\n- recomendações automáticas\n- dashboards de tendência e performance': '### Growth Loop V1 — implementado\n- fila D1 de publicação agendada com retry controlado e gate de aprovação\n- ingestão de métricas por canal\n- atribuição UTM + IDs internos por sessão\n- first/last touch associado ao lead\n- Content Score 0–100\n- Radar, Estrategista, Pesquisador, Analytics e Growth Coach\n- painel de performance, atribuição e ciclos\n\n### Evoluções dependentes de provedores\n- sincronização automática de métricas sociais conforme permissões concedidas\n- calibração dos pesos do Content Score com histórico real\n- Cloudflare Queues opcional para volumes maiores'
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          p.write_text(text)
          PY
      - name: Validar e gravar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GROWTH-OS-ARCHITECTURE.md
          git commit -m "docs: mark Growth Loop V1 capabilities implemented"
          git push origin HEAD:feature/growth-loop-v1
