name: Agentes de prospecção comercial

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy PRODUCTION']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: prospecting-automation-production
  cancel-in-progress: false

jobs:
  run-agents:
    name: Descobrir, pesquisar, qualificar e preparar leads
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Executar Market Scout e enriquecimento público
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: https://victor-simon-api.victorhugoteixeirasimon6.workers.dev
        run: |
          set -euo pipefail
          ROBOT_KEY="$(node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('victor-simon-site:production:robot').digest('hex'))")"
          curl --fail-with-body --silent --show-error --max-time 300 \
            --request POST "$API_URL/api/prospecting-maintenance/run" \
            --header "X-Robot-Key: $ROBOT_KEY" \
            --header "Content-Type: application/json"

      - name: Importar decisores públicos verificados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: https://victor-simon-api.victorhugoteixeirasimon6.workers.dev
        run: |
          set -euo pipefail
          ROBOT_KEY="$(node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('victor-simon-site:production:robot').digest('hex'))")"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "$API_URL/api/prospecting-verified-contacts/run" \
            --header "X-Robot-Key: $ROBOT_KEY" \
            --header "Content-Type: application/json"

      - name: Executar fila segura de Researcher Qualifier Personalizer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: https://victor-simon-api.victorhugoteixeirasimon6.workers.dev
        run: |
          set -euo pipefail
          ROBOT_KEY="$(node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('victor-simon-site:production:robot').digest('hex'))")"
          curl --fail-with-body --silent --show-error --max-time 300 \
            --request POST "$API_URL/api/prospecting-automation/run?limit=8" \
            --header "X-Robot-Key: $ROBOT_KEY" \
            --header "Content-Type: application/json"

      - name: Despachar alertas do Growth OS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: https://victor-simon-api.victorhugoteixeirasimon6.workers.dev
        run: |
          set -euo pipefail
          ROBOT_KEY="$(node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('victor-simon-site:production:robot').digest('hex'))")"
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST "$API_URL/api/notifications/run?limit=30" \
            --header "X-Robot-Key: $ROBOT_KEY" \
            --header "Content-Type: application/json"
