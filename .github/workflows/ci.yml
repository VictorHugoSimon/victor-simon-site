name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches-ignore: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes e validações
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências reprodutíveis
        run: npm ci
      - name: Testes, estrutura e builds
        run: npm run ci
