name: Deploy PRODUCTION

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar, migrar e publicar produção
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.pages.outputs.deployment-url }}
    env:
      DEPLOY_ENVIRONMENT: production
      WORKER_NAME: victor-simon-api
      D1_DATABASE_NAME: vhs-db
      PAGES_PROJECT_NAME: victor-simon-site
      PAGES_PRODUCTION_BRANCH: main
      CORS_ORIGIN: https://www.victorhugoteixeirasimon.com.br,https://victor-simon-site.pages.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências reprodutíveis
        run: npm ci
      - name: Testes e validações
        run: npm run ci
      - name: Preparar secrets internos
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          for (const key of ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'ADMIN_PASSWORD']) {
            if (!process.env[key]) throw new Error(`Secret ausente: ${key}`);
          }
          const derive = (label) => crypto
            .createHmac('sha256', process.env.CLOUDFLARE_API_TOKEN)
            .update(`victor-simon-site:${process.env.DEPLOY_ENVIRONMENT}:${label}`)
            .digest('hex');
          const values = {
            AUTH_SECRET: derive('auth'),
            ROBOT_KEY: derive('robot'),
            ADMIN_PASSWORD_HASH: crypto.createHash('sha256').update(process.env.ADMIN_PASSWORD).digest('hex')
          };
          for (const [key, value] of Object.entries(values)) {
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Garantir D1 e Pages
        id: bootstrap
        run: node scripts/bootstrap-cloudflare.mjs
      - name: Gerar configuração do Worker
        run: node scripts/generate-wrangler-config.mjs
      - name: Aplicar migrações D1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          command: d1 migrations apply vhs-db --remote --config wrangler.generated.jsonc
      - name: Publicar API Worker
        id: api
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          command: deploy --config wrangler.generated.jsonc
          secrets: |
            AUTH_SECRET
            ROBOT_KEY
            ADMIN_PASSWORD_HASH
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      - name: Preparar site de produção
        env:
          API_BASE: ${{ steps.api.outputs.deployment-url }}
          REQUIRE_API_BASE: 1
        run: npm run build:production
      - name: Publicar Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          command: pages deploy dist --project-name=victor-simon-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        env:
          API_URL: ${{ steps.api.outputs.deployment-url }}
          SITE_URL: ${{ steps.pages.outputs.deployment-url }}
        run: node scripts/smoke-deployment.mjs
