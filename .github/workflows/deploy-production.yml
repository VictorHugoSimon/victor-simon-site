name: Deploy PRODUCTION

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  readiness:
    name: Verificar credencial própria
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verificar sem expor valores
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = 'true' ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Credencial própria de produção disponível.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Deploy Cloudflare aguardando credencial própria::O código está pronto, mas nenhuma credencial de outro projeto será reutilizada.'
          fi

  deploy:
    name: Testar, migrar e publicar produção
    needs: readiness
    if: ${{ needs.readiness.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.pages.outputs.deployment-url }}
    env:
      DEPLOY_ENVIRONMENT: production
      WORKER_NAME: victor-simon-api
      D1_DATABASE_NAME: vhs-db
      R2_BUCKET_NAME: victor-simon-media
      PAGES_PROJECT_NAME: victor-hugo-teixeira-simon
      PAGES_PRODUCTION_BRANCH: main
      # A conta está no plano Workers Free e já usa os 5 Cron Triggers permitidos.
      # Mantém o Growth Loop disponível para execução manual sem bloquear o deploy.
      DISABLE_GROWTH_CRON: '1'
      CORS_ORIGIN: https://victor-hugo-teixeira-simon-ac9.pages.dev,https://www.victorhugoteixeirasimon.com.br
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências reprodutíveis
        run: npm ci
      - name: Testes e validações
        run: npm run ci
      - name: Preparar secrets internos
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('Secret ausente: CLOUDFLARE_API_TOKEN');
          const derive = (label) => crypto
            .createHmac('sha256', process.env.CLOUDFLARE_API_TOKEN)
            .update(`victor-simon-site:${process.env.DEPLOY_ENVIRONMENT}:${label}`)
            .digest('hex');
          const hasAdminPassword = Boolean(process.env.ADMIN_PASSWORD);
          const effectiveAdminPassword = hasAdminPassword
            ? process.env.ADMIN_PASSWORD
            : crypto.randomBytes(48).toString('base64url');
          if (!hasAdminPassword) {
            console.log('::warning::ADMIN_PASSWORD ausente. PRODUCTION seguirá com login administrativo efetivamente bloqueado até novo deploy com senha configurada.');
          }
          const values = {
            AUTH_SECRET: derive('auth'),
            ROBOT_KEY: derive('robot'),
            ADMIN_PASSWORD_HASH: crypto.createHash('sha256').update(effectiveAdminPassword).digest('hex')
          };
          for (const [key, value] of Object.entries(values)) {
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Garantir D1, Pages e R2 opcional
        id: bootstrap
        run: node scripts/bootstrap-cloudflare.mjs
      - name: Gerar configuração do Worker
        run: node scripts/generate-wrangler-config.mjs
      - name: Aplicar migrações D1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.124.0
          command: d1 migrations apply vhs-db --remote --config wrangler.generated.jsonc
      - name: Publicar API Worker
        id: api
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.124.0
          command: deploy --config wrangler.generated.jsonc
      - name: Enviar secrets do Worker
        run: |
          set -euo pipefail
          trap 'rm -f worker-secrets.json' EXIT
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = {
            AUTH_SECRET: process.env.AUTH_SECRET,
            ROBOT_KEY: process.env.ROBOT_KEY,
            ADMIN_PASSWORD_HASH: process.env.ADMIN_PASSWORD_HASH
          };
          for (const [key, value] of Object.entries(payload)) {
            if (!value) throw new Error(`Secret interno ausente: ${key}`);
          }
          fs.writeFileSync('worker-secrets.json', JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx wrangler@4.124.0 secret bulk worker-secrets.json --config wrangler.generated.jsonc
      - name: Configurar OAuth social opcional
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          INSTAGRAM_CLIENT_ID: ${{ secrets.INSTAGRAM_CLIENT_ID }}
          INSTAGRAM_CLIENT_SECRET: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler@4.124.0 secret put "$name" --config wrangler.generated.jsonc >/dev/null
          }
          if [ -n "${LINKEDIN_CLIENT_ID:-}" ] && [ -n "${LINKEDIN_CLIENT_SECRET:-}" ]; then
            put_secret LINKEDIN_CLIENT_ID "$LINKEDIN_CLIENT_ID"
            put_secret LINKEDIN_CLIENT_SECRET "$LINKEDIN_CLIENT_SECRET"
            echo 'LinkedIn OAuth configurado.'
          elif [ -n "${LINKEDIN_CLIENT_ID:-}${LINKEDIN_CLIENT_SECRET:-}" ]; then
            echo '::warning::LinkedIn OAuth incompleto; informe CLIENT_ID e CLIENT_SECRET juntos.'
          else
            echo 'LinkedIn OAuth ainda não configurado; deploy segue normalmente.'
          fi
          if [ -n "${INSTAGRAM_CLIENT_ID:-}" ] && [ -n "${INSTAGRAM_CLIENT_SECRET:-}" ]; then
            put_secret INSTAGRAM_CLIENT_ID "$INSTAGRAM_CLIENT_ID"
            put_secret INSTAGRAM_CLIENT_SECRET "$INSTAGRAM_CLIENT_SECRET"
            echo 'Instagram OAuth configurado.'
          elif [ -n "${INSTAGRAM_CLIENT_ID:-}${INSTAGRAM_CLIENT_SECRET:-}" ]; then
            echo '::warning::Instagram OAuth incompleto; informe CLIENT_ID e CLIENT_SECRET juntos.'
          else
            echo 'Instagram OAuth ainda não configurado; deploy segue normalmente.'
          fi
      - name: Configurar alertas WhatsApp opcionais
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_OWNER_NUMBER: ${{ secrets.WHATSAPP_OWNER_NUMBER }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler@4.124.0 secret put "$name" --config wrangler.generated.jsonc >/dev/null
          }
          required="${WHATSAPP_ACCESS_TOKEN:-}${WHATSAPP_PHONE_NUMBER_ID:-}${WHATSAPP_OWNER_NUMBER:-}${WHATSAPP_TEMPLATE_NAME:-}"
          if [ -n "${WHATSAPP_ACCESS_TOKEN:-}" ] && [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] && [ -n "${WHATSAPP_OWNER_NUMBER:-}" ] && [ -n "${WHATSAPP_TEMPLATE_NAME:-}" ]; then
            put_secret WHATSAPP_ACCESS_TOKEN "$WHATSAPP_ACCESS_TOKEN"
            put_secret WHATSAPP_PHONE_NUMBER_ID "$WHATSAPP_PHONE_NUMBER_ID"
            put_secret WHATSAPP_OWNER_NUMBER "$WHATSAPP_OWNER_NUMBER"
            put_secret WHATSAPP_TEMPLATE_NAME "$WHATSAPP_TEMPLATE_NAME"
            put_secret WHATSAPP_TEMPLATE_LANGUAGE "${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}"
            echo 'Alertas WhatsApp do Growth OS configurados sem expor credenciais ou telefone.'
          elif [ -n "$required" ]; then
            echo '::warning::Configuração WhatsApp incompleta; os eventos ficarão enfileirados e não serão enviados até todos os secrets obrigatórios existirem.'
          else
            echo 'WhatsApp ainda não conectado; fila de alertas permanece disponível sem bloquear o deploy.'
          fi
      - name: Preparar site de produção
        env:
          API_BASE: ${{ steps.api.outputs.deployment-url }}
          SITE_BASE: https://victor-hugo-teixeira-simon-ac9.pages.dev
          REQUIRE_API_BASE: 1
        run: npm run build:production
      - name: Publicar Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.124.0
          command: pages deploy dist --project-name=victor-hugo-teixeira-simon --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        env:
          API_URL: ${{ steps.api.outputs.deployment-url }}
          SITE_URL: ${{ steps.pages.outputs.deployment-url }}
        run: node scripts/smoke-deployment.mjs
