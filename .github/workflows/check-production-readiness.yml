name: Production Readiness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feature/growth-os-v2' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verificar credenciais sem expor valores
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_ADMIN: ${{ secrets.ADMIN_PASSWORD != '' }}
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_API_TOKEN=${HAS_TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID=${HAS_ACCOUNT}"
          echo "ADMIN_PASSWORD=${HAS_ADMIN}"
          if [ "$HAS_TOKEN" != 'true' ] || [ "$HAS_ADMIN" != 'true' ]; then
            echo 'Perfil ainda não possui credenciais mínimas próprias de produção.' >&2
            exit 1
          fi
          echo 'Perfil possui credenciais mínimas próprias de produção.'
